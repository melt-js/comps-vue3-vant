<!doctype html>
<!-- hel-standalone：给调试页样式做作用域，避免 hel_dist 把页面级样式注入宿主 -->
<html lang="zh-CN" class="hel-standalone">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>comps-vue3-vant</title>
    <!--
      vue 被 external 成 window.Vue，独立访问本页时由这里的 CDN 提供运行时；
      data-helappend="0"：宿主通过 hel 解析本页时跳过该脚本，
      使用宿主自己在入口注入的那一份，避免双实例（双 vue）。
    -->
    <script data-helappend="0" src="https://unpkg.com/vue@3.5.45/dist/vue.global.prod.js"></script>
    <script type="module" crossorigin src="/comps-vue3-vant/hel_dist/assets/index-CkZabnm2.js"></script>
    <link rel="modulepreload" crossorigin href="/comps-vue3-vant/hel_dist/assets/preload-helper-75t3YZFg.js">
    <link rel="modulepreload" crossorigin href="/comps-vue3-vant/hel_dist/assets/shared-runtime-BV8Oig6u.js">
    <link rel="modulepreload" crossorigin href="/comps-vue3-vant/hel_dist/assets/vendor-BmaFqEDl.js">
    <link rel="stylesheet" crossorigin href="/comps-vue3-vant/hel_dist/assets/style-BfcGmqll.css">
  </head>
  <body>
    <div id="vant-standalone"></div>
  </body>
</html>
